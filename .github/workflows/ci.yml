name: Cross-platform CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-api:
    name: Python/API/JS / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install lightweight test dependencies without model weights
        run: python -m pip install pytest numpy soundfile fastapi uvicorn python-multipart python-dotenv httpx
      - name: Compile Python syntax
        run: python -m compileall -q studio.py server.py model_backends.py indic_worker.py sentence_editor.py tests
      - name: Python API, history, sentence editor and setup regressions
        run: python -m pytest -q tests
      - name: JavaScript / UI syntax
        run: |
          node --check static/app.js
          node --check static/edit_audio.js
          node --check static/edit_direction.js
          node tests/auto_markup.test.cjs
      - name: Expression editing tests
        run: node --test tests/edit_direction.test.cjs
      - name: Installer diagnostics without downloads
        run: python studio.py --diagnose

  windows-indic-native:
    name: Windows native TorchAudio and Indic Parler import
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Create isolated Python environment
        shell: pwsh
        run: |
          python -m venv .venv-indic
          .\.venv-indic\Scripts\python.exe -m pip install --upgrade pip
      - name: Install a published, compatible CPU Torch/TorchAudio pair
        shell: pwsh
        run: |
          .\.venv-indic\Scripts\python.exe -m pip install "torch==2.11.0" "torchaudio==2.11.0" --index-url https://download.pytorch.org/whl/cpu
      - name: Validate native Windows TorchAudio DLL loading
        shell: pwsh
        run: |
          .\.venv-indic\Scripts\python.exe -c "import torch, torchaudio; assert torch.__version__.split('+')[0] == torchaudio.__version__.split('+')[0] == '2.11.0'; print(torch.__version__, torchaudio.__version__)"
      - name: Install Parler into the same isolated environment
        shell: pwsh
        run: |
          .\.venv-indic\Scripts\python.exe -m pip install git+https://github.com/huggingface/parler-tts.git
      - name: Verify Parler class, native libraries and dependency integrity
        shell: pwsh
        run: |
          .\.venv-indic\Scripts\python.exe -c "import torch, torchaudio; from parler_tts import ParlerTTSForConditionalGeneration; print('Indic imports:', torch.__version__, torchaudio.__version__)"
          .\.venv-indic\Scripts\python.exe -m pip check
      - name: Run Studio's two-environment diagnostics
        run: python studio.py --diagnose

  windows-chatterbox-native:
    name: Windows Chatterbox native dependencies and class import
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Prepare isolated clone environment
        shell: pwsh
        run: |
          python -m venv .venv-clone
          .\\.venv-clone\\Scripts\\python.exe -m pip install --upgrade pip
      - name: Install official Chatterbox engine into isolated Python
        shell: pwsh
        run: |
          .\\.venv-clone\\Scripts\\python.exe -m pip install chatterbox-tts soundfile
      - name: Native TorchAudio and Chatterbox class import
        shell: pwsh
        run: |
          .\\.venv-clone\\Scripts\\python.exe -c "import torch, torchaudio, soundfile; from chatterbox.mtl_tts import ChatterboxMultilingualTTS; print('Clone native imports OK:', torch.__version__, torchaudio.__version__)"
          .\\.venv-clone\\Scripts\\python.exe -m pip check
      - name: Verify isolated installer diagnostics
        run: python studio.py --diagnose
